  <circle cx="136" cy="132" r="10" fill="#ffffff" />
  <path d="M 102 156 Q 114 166 126 156" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- the sweep of र as a pennant flying off the wheel -->
  <path d="M 176 118 L 222 84" stroke="#171717" stroke-width="18" stroke-linecap="round" />
</svg>
