<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>Prakruti — cloud buddy mark</title>
  <!-- Concept G: Cloud Buddy — a plump cloud creature with a leaf sprout; one-colour with knockout face -->
