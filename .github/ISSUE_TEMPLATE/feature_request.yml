name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Got a quick question or idea? Use [Discussions](https://github.com/imstillashish/Prakruti/discussions) instead — it's faster.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I'm trying to do X but can't because…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Dashboard / frontend
        - API / backend
        - AI / ML pipeline
        - New city coverage
        - Data / datasets
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to implement this?
      options:
        - label: Yes, I'd like to submit a PR
